    <!-- Body -->
    <rect x="24" y="32" width="16" height="20" fill="#000000" />
    <!-- Legs -->
    <rect x="24" y="52" width="8" height="12" fill="#1E90FF" />
    <rect x="32" y="52" width="8" height="12" fill="#1E90FF" />
    <!-- Arms -->
    <rect x="16" y="32" width="8" height="20" fill="#8B4513" />
    <rect x="40" y="32" width="8" height="20" fill="#8B4513" />
    <!-- Hair -->
    <rect x="24" y="0" width="16" height="4" fill="#000000" />
    <!-- Face -->
    <rect x="28" y="8" width="4" height="4" fill="#000000" />
    <rect x="32" y="8" width="4" height="4" fill="#000000" />
    <!-- Bracelet -->
